<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171715">
  <meta name="description" content="Цифровой наставник для адаптации сотрудников системы молодежной политики ЛНР">
  <title>Цифровой наставник</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="regional-landscape" aria-hidden="true">
    <svg viewBox="0 0 1600 430" preserveAspectRatio="none">
      <path class="landscape-haze" d="M0 322C170 286 286 308 421 291c172-22 264-67 424-45 129 18 211 72 340 45 153-32 259-26 415 13v126H0Z"/>
      <path class="terrikon far" d="M0 357h95l112-142 86 142h149l86-106 69 106h137l120-174 133 174h120l73-90 76 90h144v73H0Z"/>
      <path class="terrikon near" d="M0 388h150l102-111 91 111h217l69-73 62 73h262l136-126 111 126h400v42H0Z"/>
      <g class="mine-silhouette">
        <path d="M1198 365 1258 142h61l71 223h-30l-21-67h-100l-17 67Zm50-98h81l-39-91Z"/>
        <path d="M1276 142V83h26v59M1234 83h111v18h-111zM1218 64h144v19h-144zM1242 64l48-43 48 43h-28l-20-18-20 18z"/>
        <path d="M1280 101h20v264h-20zM1175 365h242v22h-242z"/>
        <circle cx="1290" cy="74" r="25"/><circle class="wheel-core" cx="1290" cy="74" r="14"/>
      </g>
      <path class="steppe-line" d="M0 396c108-16 204-7 298 3 129 14 211-9 333-4 133 6 210 28 350 10 149-19 243-18 365-3 96 12 163 8 254-5"/>
      <path class="steppe-grass" d="m67 411 15-42 1 42 21-29-9 29m237 0 11-54 7 54 19-34-7 34m613 0 15-49 1 49 23-31-11 31m472 0 8-55 8 55 17-35-6 35"/>
    </svg>
  </div>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Навигация">
      <a class="brand" href="#" data-action="home" aria-label="Цифровой наставник, на главную">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M24 2 30 16 46 24 30 32 24 46 18 32 2 24 18 16Z"/><path class="brand-core" d="m24 15 9 9-9 9-9-9Z"/></svg></span>
        <span><strong>Цифровой</strong><small>наставник</small></span>
      </a>

      <div class="profile-card">
        <div class="profile-top">
          <button class="avatar" id="profileAvatar" data-action="profile" aria-label="Открыть профиль и изменить фотографию" title="Изменить фотографию">Н</button>
          <div><strong id="profileName">Новый сотрудник</strong><span id="profileRole">Начало маршрута</span></div>
        </div>
        <div class="progress-label"><span>Адаптация</span><b id="progressValue">0%</b></div>
        <div class="progress-track"><span id="progressBar"></span></div>
        <button class="profile-edit" data-action="profile">Изменить профиль</button>
      </div>

      <button class="sidebar-scroll" data-action="sidebar-scroll" aria-label="Прокрутить меню вниз" title="Прокрутить меню вниз"><span>↓</span>Ниже</button>

      <nav class="main-nav">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>Мой день</button>
        <button class="nav-item" data-view="route"><span class="nav-icon">↗</span>Мои 90 дней</button>
        <button class="nav-item" data-view="workshop"><span class="nav-icon">✦</span>Рабочая мастерская</button>
        <button class="nav-item" data-view="knowledge"><span class="nav-icon">≡</span>База знаний</button>
        <button class="nav-item" data-view="tasks"><span class="nav-icon">✓</span>Мои задания <span class="nav-count" id="taskCount">5</span></button>
        <button class="nav-item" data-view="saved"><span class="nav-icon">☆</span>Сохранённое <span class="nav-count" id="savedCount">0</span></button>
        <button class="nav-item admin-nav" id="adminNav" data-view="admin"><span class="nav-icon">⌘</span>Аналитика</button>
      </nav>

      <div class="sidebar-bottom">
        <button class="support-link admin-link" data-action="admin"><span>⌘</span><b id="adminLinkText">Вход администратора</b></button>
        <button class="support-link" data-action="expert"><span>?</span>Спросить специалиста</button>
        <button class="support-link" data-action="rules"><span>i</span>О боте и правила</button>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M24 2 30 16 46 24 30 32 24 46 18 32 2 24 18 16Z"/><path class="brand-core" d="m24 15 9 9-9 9-9-9Z"/></svg></span><strong>Цифровой наставник</strong></div>
        <div class="status"><i></i><span>Материалы прототипа</span></div>
        <button class="admin-badge" id="adminBadge" data-action="admin">Администратор</button>
        <button class="search-button" data-view="knowledge" aria-label="Открыть поиск"><span>⌕</span><kbd>Поиск</kbd></button>
        <button class="theme-toggle" id="themeToggle" data-action="toggle-theme" aria-label="Включить светлую тему" aria-pressed="false"><span>☀</span><b>Светлая</b></button>
        <button class="more-button" data-action="rules" aria-label="Правила">•••</button>
      </header>

      <section class="content" id="appContent" aria-live="polite"></section>
    </main>

    <nav class="mobile-nav" aria-label="Мобильная навигация">
      <button class="active" data-view="home"><span>⌂</span>Мой день</button>
      <button data-view="route"><span>↗</span>Маршрут</button>
      <button data-view="workshop"><span>✦</span>Мастерская</button>
      <button data-view="knowledge"><span>≡</span>База знаний</button>
      <button data-view="tasks"><span>✓</span>Мои задания</button>
      <button data-view="saved"><span>☆</span>Сохранённое</button>
    </nav>
  </div>

  <aside class="mascot-widget" id="mascotWidget" aria-label="Искорик — ИИ-агент">
    <button class="mascot-launch" data-action="mascot-open" aria-label="Открыть чат с Искориком">
      <svg viewBox="0 0 180 150" aria-hidden="true">
        <path class="mascot-tail" d="M132 92c31-17 42 4 28 19-11 12-29 8-36-1 19 3 24-9 8-18Z"/>
        <path class="mascot-ear" d="m50 48 8-37 29 30M130 48l-8-37-29 30"/>
        <path class="mascot-face" d="M42 61c3-27 22-39 48-39s45 12 48 39v35c0 25-21 42-48 42S42 121 42 96Z"/>
        <path class="mascot-mask" d="M50 70c18-17 30-13 40 2 10-15 22-19 40-2-3 31-17 52-40 52S53 101 50 70Z"/>
        <path class="mascot-eye" d="M64 78h13l-6 8ZM103 78h13l-7 8Z"/>
        <path class="mascot-nose" d="m90 91 8 8-8 6-8-6Z"/>
        <path class="mascot-spark" d="m90 2 4 9 10 4-10 4-4 10-4-10-10-4 10-4Z"/>
      </svg>
      <span>Искорик</span>
    </button>
    <section class="mascot-chat" id="mascotChat" aria-hidden="true">
      <header><div class="mascot-chat-avatar">ИИ</div><div><b>Искорик</b><span><i></i> ИИ-агент по адаптации</span></div><button data-action="mascot-close" aria-label="Закрыть чат">×</button></header>
      <div class="mascot-messages" id="mascotMessages" aria-live="polite"></div>
      <div class="mascot-quick"><button data-mascot-prompt="task">Задание дня</button><button data-mascot-prompt="find">Помоги найти</button><button data-mascot-prompt="help">Что ты умеешь?</button></div>
      <form class="mascot-form" id="mascotForm"><input id="mascotInput" autocomplete="off" maxlength="500" placeholder="Задайте вопрос или опишите задачу…" aria-label="Сообщение Искорику"><button type="submit" aria-label="Отправить сообщение">↑</button></form>
      <footer><small>ИИ-агент использует материалы сайта и данные вашего маршрута. Переписка хранится только в этом браузере.</small></footer>
    </section>
  </aside>

  <dialog id="modal" class="modal">
    <button class="modal-close" data-action="close-modal" aria-label="Закрыть">×</button>
    <div id="modalContent"></div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="glossary-data.js"></script>
  <script src="normative-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
